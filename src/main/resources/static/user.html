<!DOCTYPE html>
<html>
<head>
    <title>User Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <a href="index.html">&larr; Back</a>

    <h1 id="userName">User Tasks</h1>


    <!-- NEW LIST -->

    <div class="section">

        <h2>Create New List</h2>

        <input type="text"
               id="newListName"
               placeholder="List Name">

        <button onclick="createList()">
            Create List
        </button>

    </div>


    <!-- TASK LISTS -->

    <h2>Task Lists</h2>

    <div id="taskListContainer">
        Loading task lists...
    </div>


    <!-- TODAY TASKS -->

    <div class="section">

        <h2>Today's Tasks</h2>

        <button onclick="loadTodayTasks()">
            View Today's Tasks
        </button>

        <div id="todayTasks">
            Click the button to view today's tasks.
        </div>

    </div>


    <!-- NEW TASK -->

    <div class="section">

        <h2>Add Task</h2>

        <input type="text"
               id="taskTitle"
               placeholder="Task Title">

        <input type="date"
               id="taskDueDate">

        <select id="taskPriority">

            <option value="LOW">LOW</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="HIGH">HIGH</option>

        </select>


        <select id="taskList">

            <option value="">
                Select Task List
            </option>

        </select>


        <button onclick="addTask()">
            Add Task
        </button>

    </div>


    <p id="message"></p>

</div>

<script src="script.js"></script>

</body>
</html>
